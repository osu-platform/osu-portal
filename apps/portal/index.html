    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: var(--p-color-bg-secondary, var(--tg-theme-bg-color));
      }
      #global-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--p-color-bg-primary, var(--tg-theme-bg-color));
        z-index: 9999999;
        transition:
          opacity 0.5s ease-in-out,
          visibility 0.5s ease-in-out;
      }
      #global-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #global-loader svg {
        width: 177px;
        height: 416px;
        max-width: 50vw;
        max-height: 50vh;
        /* Removed drop-shadow as requested */
      }
      #global-loader path {
        /* Цвет портала через CSS-переменную с запасным значением */
        fill: var(--p-color-text-primary, var(--tg-theme-text-color, #ffffff));
        opacity: 0; /* Start hidden for fade-in */
        transform: translateY(50px) scale(0.9); /* Start position matching V3 hidden state */
        transform-origin: 50% 25%; /* Match V3 portal origin */
        transform-box: view-box;
      }

      /* Appearance Animation */
      @keyframes osu-appear {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Breathing Animations (Stepped Wave) */
      /* Delays are handled in the animation definition */

      /* Index 7 (Top) */
      @keyframes osu-breath-7 {
        0%,
        100% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-16px);
          animation-timing-function: linear;
        }
        62.5% {
          transform: translateY(-16px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        87.5% {
          transform: translateY(0);
          animation-timing-function: linear;
        }
      }
      /* Index 6 */
      @keyframes osu-breath-6 {
        0%,
        100% {
          transform: translateY(0);
        }
        4.16% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        29.16% {
          transform: translateY(-16px);
          animation-timing-function: linear;
        }
        58.33% {
          transform: translateY(-16px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        83.33% {
          transform: translateY(0);
          animation-timing-function: linear;
        }
      }
      /* Index 5 */
      @keyframes osu-breath-5 {
        0%,
        100% {
          transform: translateY(0);
        }
        8.33% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        33.33% {
          transform: translateY(-16px);
          animation-timing-function: linear;
        }
        54.16% {
          transform: translateY(-16px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        79.16% {
          transform: translateY(0);
          animation-timing-function: linear;
        }
      }
      /* Index 4 (Bottom) */
      @keyframes osu-breath-4 {
        0%,
        100% {
          transform: translateY(0);
        }
        12.5% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        37.5% {
          transform: translateY(-16px);
          animation-timing-function: linear;
        }
        50% {
          transform: translateY(-16px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        75% {
          transform: translateY(0);
          animation-timing-function: linear;
        }
      }

      /* Portal Exit Animations */
      @keyframes osu-portal-7-exit {
        0% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        /* Keep opacity 1 to cover the screen with blue */
        100% {
          transform: translateY(0) scale(80);
          opacity: 1;
        }
      }

      @keyframes osu-portal-others-exit {
        0% {
          transform: translateY(0) scale(1);
          opacity: 1;
          filter: blur(0);
        }
        100% {
          transform: translateY(200px) scale(0);
          opacity: 0;
          filter: blur(10px);
        }
      }

      /* Apply animations */
      /* 1. Appear: 0.6s ease-out forwards */
      /* 2. Breath: starts after appear + small hold. Let's say 1.2s delay total */

      .path-emblem {
        animation: osu-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .path-anim-4 {
        animation:
          osu-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.4s,
          osu-breath-4 2.4s infinite 1.4s; /* 0.4s delay + 1s hold */
      }
      .path-anim-5 {
        animation:
          osu-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.5s,
          osu-breath-5 2.4s infinite 1.5s;
      }
      .path-anim-6 {
        animation:
          osu-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.6s,
          osu-breath-6 2.4s infinite 1.6s;
      }
      .path-anim-7 {
        animation:
          osu-appear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.7s,
          osu-breath-7 2.4s infinite 1.7s;
      }

      /* Stagger emblem parts */
      .path-emblem:nth-child(1) {
        animation-delay: 0s;
      }
      .path-emblem:nth-child(2) {
        animation-delay: 0.1s;
      }
      .path-emblem:nth-child(3) {
        animation-delay: 0.2s;
      }
      .path-emblem:nth-child(4) {
        animation-delay: 0.3s;
      }

      /* Portal Exit State Triggered by JS */
      .portal-active {
        /* Fade out the entire loader (bg + svg) to reveal app */
        opacity: 0;
        /* Delay fade out to let portal expand and cover screen first */
        transition: opacity 0.8s ease-out 1s;
        pointer-events: none;
      }

      .portal-active .path-anim-7 {
        animation: osu-portal-7-exit 1.8s cubic-bezier(0.8, 0, 0.2, 1) forwards !important;
        animation-delay: 0.1s !important;
      }

      .portal-active .path-anim-4,
      .portal-active .path-anim-5,
      .portal-active .path-anim-6,
      .portal-active .path-emblem {
        animation: osu-portal-others-exit 0.8s ease-in forwards !important;
        animation-delay: 0s !important;
      }
    </style>
  </head>
